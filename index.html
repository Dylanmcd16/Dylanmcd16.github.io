        <h1>Dylan McDermott</h1>
        <p>Meteorologist and geospatial data professional based in West Des Moines, Iowa.</p>
        <p>Dylan builds automated geospatial and weather-data workflows that turn scientific observations into reliable maps, analyses, and operational products — spanning operational weather and catastrophe systems, field-sensing research, and atmospheric modeling.</p>
        <h2>Experience</h2>
        <ul>
          <li>Meteorologist — Weather and Catastrophe Analyst, Property &amp; Liability Resource Bureau (January 2025–Present)</li>
          <li>Field Sensing Research Associate (contract), Corteva Agriscience, Johnston, Iowa (June 2024–December 2024)</li>
          <li>Graduate Research Assistant, Iowa State University (May 2022–May 2024)</li>
          <li>Undergraduate Research Assistant, Iowa State University (May 2021–August 2021)</li>
        </ul>
        <h2>Education</h2>
        <ul>
          <li>M.S. in Meteorology, Iowa State University (2024). Thesis: Impacts of U.S. Deforestation on Rainfall from Mesoscale Convective Systems.</li>
          <li>B.S. in Meteorology, Iowa State University (2022). Senior thesis: Extreme Convective Wind Magnitude and Duration in Iowa. Dean's List honors.</li>
        </ul>
        <h2>Awards</h2>
        <ul>
          <li>Esri Special Achievement in GIS (SAG) Award, 2025 — contributed to the recognized PLRB catastrophe analytics and ArcGIS applications.</li>
          <li>AWS 10,000 AIdeas Competition Semi-Finalist — AI Weather Intelligence Platform.</li>
        </ul>
        <h2>Work Examples</h2>
        <article>
          <h3><a href="/work/plrb-weather-systems/">PLRB - Meteorologist</a></h3>
          <p>Builds and maintains the automated Python and ArcPy workflows, geospatial products, and claims-facing ArcGIS applications that keep weather and catastrophe evidence accurate in daily production.</p>
        </article>
        <article>
          <h3><a href="/work/corteva-field-sensing/">Corteva - Research Associate</a></h3>
          <p>Co-developed the Smartstick field-sensing platform and built the Python and ArcPy workflow that processed its GPS-linked observations across seven research sites into quality-controlled, plot-level geospatial analyses. Analyzed soil-moisture, evapotranspiration, irrigation, and crop-development data to estimate crop water use and evaluate crop stress.</p>
        </article>
        <article>
          <h3><a href="/work/land-use-convective-weather/">Master's Thesis - Iowa State University</a></h3>
          <p>Designed and ran WRF and Noah-MP simulations to determine how historical land-use change affected Midwest rainfall and mesoscale convective systems.</p>
        </article>
        <h2>Personal Projects</h2>
        <article>
          <h3><a href="/projects/iowa-severe-weather-explorer/">Iowa Severe Weather Explorer</a></h3>
          <p>An end-to-end meteorological data pipeline and web application that reconstructs the August 10, 2020 Iowa derecho on one synchronized timeline from archived NEXRAD radar, IEM storm reports and warning polygons, ASOS/AWOS observations, HRRR model fields, and GOES-16 satellite imagery.</p>
        </article>
        <article>
          <h3>AI Weather Intelligence Platform (2025–Present)</h3>
          <p>A full-stack platform integrating more than 200 weather and environmental data streams into source-backed historical, current, and forecast analyses. Named a Semi-Finalist in the AWS 10,000 AIdeas Competition.</p>
        </article>
        <h2>Core Skills</h2>
        <p>Meteorological analysis, catastrophe research, spatial analysis, Python automation, ArcPy, ArcGIS Pro, ArcGIS Enterprise and Server, Experience Builder, data quality control and validation, data integration, REST APIs, radar, GOES, MODIS, MRMS, numerical weather prediction, machine learning, field sensing, remote sensing, drone imagery, LiDAR, WRF, Noah-MP, AWS, SQL, PostgreSQL, MATLAB, R, React, TypeScript, FastAPI, and Linux.</p>
