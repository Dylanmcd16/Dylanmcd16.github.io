      <main>
        <h1>Dylan McDermott</h1>
        <p>Meteorologist and geospatial data professional based in West Des Moines, Iowa.</p>
        <p>Dylan builds reliable weather-data workflows, maps, and operational tools across catastrophe analysis, field-sensing research, and atmospheric modeling.</p>
        <h2>Experience</h2>
        <ul>
          <li>Meteorologist, Property &amp; Liability Resource Bureau (January 2025–Present)</li>
          <li>Field Sensing Research Associate (Contract), Corteva Agriscience, Johnston, Iowa (June 2024–January 2025)</li>
          <li>Graduate Research Assistant, Iowa State University (May 2022–May 2024)</li>
          <li>Undergraduate Research Assistant, Iowa State University (May 2021–August 2021)</li>
        </ul>
        <h2>Education</h2>
        <ul>
          <li>M.S. in Meteorology, Iowa State University (2024). Thesis: Impacts of US Deforestation on Rainfall from Mesoscale Convective Systems.</li>
          <li>B.S. in Meteorology, Iowa State University (2022). Senior thesis: Extreme Convective Wind Magnitude and Duration in Iowa.</li>
        </ul>
        <h2>Awards</h2>
        <ul>
          <li>Esri Special Achievement in GIS (SAG) Award, 2025 — contributed to the recognized PLRB catastrophe analytics and ArcGIS applications.</li>
          <li>AWS 10,000 AIdeas Competition Semi-Finalist — AI Weather Intelligence Platform.</li>
        </ul>
        <h2>Work Examples</h2>
        <article>
          <h3><a href="/work/plrb-weather-systems/">PLRB - Meteorologist</a></h3>
          <p>Automates weather-data pipelines and builds claims-facing ArcGIS applications that keep catastrophe evidence validated, synchronized, and ready for daily use.</p>
        </article>
        <article>
          <h3><a href="/work/corteva-field-sensing/">Corteva - Research Associate</a></h3>
          <p>Co-developed field-sensing systems and independently built a Python and ArcPy pipeline for GPS-linked measurements across seven research sites. Produced quality-controlled plot summaries and saved roughly 100 hours of manual processing across the campaign.</p>
        </article>
        <article>
          <h3><a href="/work/land-use-convective-weather/">Master's Thesis - Iowa State University</a></h3>
          <p>Ran WRF with Noah-MP to compare present-day and 1850 vegetation during the 1993 and 2008 Midwest flood periods. Analyzed simulated changes in rainfall, surface fluxes, and moisture transport.</p>
        </article>
        <h2>Personal Projects</h2>
        <article>
          <h3><a href="/projects/iowa-severe-weather-explorer/">Iowa Severe Weather Explorer</a></h3>
          <p>Built an interactive replay of the August 10, 2020 Iowa derecho, combining NEXRAD radar, surface observations, HRRR, GOES-16, warnings, storm reports, and damage data on one timeline.</p>
        </article>
        <article>
          <h3><a href="/projects/iowa-soybean-season-explorer/">Iowa Soybean Season Explorer</a></h3>
          <p>A 2025 season timelapse across 248 central Iowa fields, using 59 usable Sentinel-2 dates and MRMS radar rainfall. A descriptive visualization of public data, not a yield prediction model.</p>
        </article>
        <article>
          <h3>AI Weather Intelligence Platform (2025–Present)</h3>
          <p>An independently developed AI weather intelligence platform that extracts evidence from scattered environmental data and generates responses, reports, maps, plots, and more. Semi-finalist in the AWS 10,000 AIdeas Competition.</p>
        </article>
        <h2>Skills</h2>
        <ul>
          <li>Meteorology &amp; Weather Analysis: Analyze radar, satellite, and model data for severe-weather verification and claims investigations. Evaluate datasets for bias, resolution, provenance, and appropriate interpretation. Tools and methods: NEXRAD / MRMS, GOES, ERA5, Observations &amp; model guidance.</li>
          <li>Numerical Modeling &amp; Scientific Computing: Design WRF and Noah-MP experiments, translate CESM/LUMIP land-use inputs to model grids, and analyze rainfall, surface fluxes, and moisture transport. Tools and methods: WRF / Noah-MP, CESM / LUMIP, Python, MATLAB / NetCDF.</li>
          <li>Python Pipelines &amp; Data Quality: Acquire, standardize, and validate environmental data. Reconcile late reports and detect duplicates, missing timestamps, invalid identifiers, and failed downloads in daily production workflows. Tools and methods: Python, ArcPy, REST APIs, AWS / Linux.</li>
          <li>Geospatial Processing &amp; Web GIS: Build spatial workflows with GPS filtering, inward plot buffers, spatial joins, and raster/vector processing. Develop claims-facing maps with custom filters and synchronized layers. Tools and methods: ArcGIS Pro &amp; Enterprise, ArcPy, Experience Builder, Spatial ETL.</li>
          <li>Field Instrumentation &amp; Agricultural Research: Co-develop GPS-linked sensing platforms, automated soil-gas systems, and reference weather stations. Compare canopy measurements with drone imagery, LiDAR, and crop-stress response. Tools and methods: Trimble GPS, Infrared radiometers, Drone imagery / LiDAR, Sensor calibration.</li>
          <li>Applied AI &amp; Scientific Tooling: Build agentic weather workflows with LLM tool orchestration, structured schemas, evidence-backed responses, and provenance controls. Test working prototypes through evaluation, replay, and failure handling. Tools and methods: OpenAI tooling, Python / FastAPI, React, Supabase.</li>
        </ul>
