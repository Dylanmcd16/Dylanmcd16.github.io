        <h1>Dylan McDermott</h1>
        <p>Meteorologist and geospatial data professional based in West Des Moines, Iowa.</p>
        <p>Dylan builds reliable weather-data workflows, maps, and operational tools across catastrophe analysis, field-sensing research, and atmospheric modeling.</p>
        <h2>Experience</h2>
        <ul>
          <li>Meteorologist, Property &amp; Liability Resource Bureau (January 2025–Present)</li>
          <li>Field Sensing Research Associate (Contract), Corteva Agriscience, Johnston, Iowa (June 2024–January 2025)</li>
          <li>Graduate Research Assistant, Iowa State University (May 2022–May 2024)</li>
          <li>Undergraduate Research Assistant, Iowa State University (May 2021–August 2021)</li>
        </ul>
        <h2>Education</h2>
        <ul>
          <li>M.S. in Meteorology, Iowa State University (2024). Thesis: Impacts of US Deforestation on Rainfall from Mesoscale Convective Systems.</li>
          <li>B.S. in Meteorology, Iowa State University (2022). Senior thesis: Extreme Convective Wind Magnitude and Duration in Iowa.</li>
        </ul>
        <h2>Awards</h2>
        <ul>
          <li>Esri Special Achievement in GIS (SAG) Award, 2025 — contributed to the recognized PLRB catastrophe analytics and ArcGIS applications.</li>
          <li>AWS 10,000 AIdeas Competition Semi-Finalist — AI Weather Intelligence Platform.</li>
        </ul>
        <h2>Work Examples</h2>
        <article>
          <h3><a href="/work/plrb-weather-systems/">PLRB - Meteorologist</a></h3>
          <p>Automates weather-data pipelines and builds claims-facing ArcGIS applications that keep catastrophe evidence validated, synchronized, and ready for daily use.</p>
        </article>
        <article>
          <h3><a href="/work/corteva-field-sensing/">Corteva - Research Associate</a></h3>
          <p>Built the Python and ArcPy pipeline for a GPS-linked field-sensing platform at seven research sites. It saved about an hour per collection—weeks across the campaign—and produced quality-checked plot summaries.</p>
        </article>
        <article>
          <h3><a href="/work/land-use-convective-weather/">Master's Thesis - Iowa State University</a></h3>
          <p>Ran multi-resolution WRF and Noah-MP experiments comparing present-day and 1850 vegetation. Measured effects on Midwest rainfall, surface fluxes, moisture transport, and mesoscale convective systems.</p>
        </article>
        <h2>Personal Projects</h2>
        <article>
          <h3><a href="/projects/iowa-severe-weather-explorer/">Iowa Severe Weather Explorer</a></h3>
          <p>Built an interactive replay of the August 10, 2020 Iowa derecho, combining NEXRAD radar, surface observations, HRRR, GOES-16, warnings, storm reports, and damage data on one timeline.</p>
        </article>
        <article>
          <h3>AI Weather Intelligence Platform (2025–Present)</h3>
          <p>An independently designed full-stack AI platform that extracts evidence and generates reports from 200+ environmental data streams. Semi-finalist in the AWS 10,000 AIdeas Competition.</p>
        </article>
        <h2>Core Skills</h2>
        <p>Meteorological analysis, catastrophe modeling, severe weather verification, spatial analysis, Spatial ETL, Python automation, ArcPy, ArcGIS Pro, ArcGIS Enterprise and Server, Experience Builder, data quality control and validation, data integration, REST APIs, radar, GOES, MODIS, MRMS, numerical weather prediction, machine learning, field sensing, remote sensing, drone imagery, LiDAR, WRF, Noah-MP, AWS, SQL, PostgreSQL, MATLAB, R, C++, React, TypeScript, FastAPI, and Linux.</p>
