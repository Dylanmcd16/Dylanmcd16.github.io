        <p>Corteva Agriscience — Field Sensing Research Associate (Contract)</p>
        <h1>Field-Sensing Systems &amp; Geospatial Research</h1>
        <p>I co-developed field-sensing systems and independently built Python and ArcPy workflows that converted high-frequency measurements into quality-controlled, plot-level research data.</p>
        <ul>
          <li>Field sensing</li>
          <li>Python</li>
          <li>ArcPy</li>
          <li>Trimble GPS</li>
          <li>LiDAR</li>
          <li>Instrumentation</li>
          <li>Quality control</li>
        </ul>

        <h2>The challenge: Turning field measurements into reliable research evidence</h2>
        <p>Field-sensing research requires more than collecting measurements. Sensors must be designed, deployed, maintained, and connected to workflows that identify bad readings, preserve spatial context, and produce data researchers can compare across plots, sites, instruments, and experiments. My work covered that full process—from building and operating field systems to automating the quality control, geospatial processing, visualization, and analysis of their measurements.</p>

        <h2>Smartstick sensing platform</h2>
        <p>I co-developed Corteva's Smartstick, a wheeled platform that recorded crop-canopy conditions while moving through experimental rows, and operated it throughout the season. Infrared thermometer (IRT) sensors measured canopy temperature, while photosynthetically active radiation (PAR) sensors measured light at different canopy levels. Thermocouples and other sensors also measured temperature within and above the canopy.</p>
        <p>An onboard computer recorded each observation with a timestamp and Trimble GPS coordinate. I designed the sensor placement, field procedures, and downstream analysis system; the enclosure's internal logging and cloud-transfer implementation were handled by others.</p>
        <ul>
          <li>Collected thousands of spatially referenced measurements per walk.</li>
          <li>Conducted repeated field collections across the research season.</li>
          <li>I led coordination with teams in California, Puerto Rico, Texas, and Chile, reviewing sensor setups and measurement data and guiding changes to standardize collection methods across sites.</li>
        </ul>

          <img src="/smartstick.jpeg" alt="Corteva Smartstick mobile field-sensing platform" loading="lazy" />
          <figcaption>Field collection setup - Mobile platform with IRT and PAR sensors for canopy temperature and light measurements, recorded with GPS and timestamps.</figcaption>
        </figure>
        <figure>

        <h2>Automated geospatial processing and analysis</h2>
        <p>I independently built the Python and ArcPy pipeline that processed each collection from raw tabular files through research-ready outputs. It standardized the data, plotted measurements for visual quality control, removed irrelevant or unrealistic readings, excluded bad GPS positions and outliers, converted coordinates to points, and spatially joined every valid observation to its experimental plot, treatment, and genotype.</p>
        <p>ArcPy used plot boundaries and inward buffers to remove observations outside plots or too close to plot edges. The workflow then generated point layers, shapefiles, plot summaries, maps, tables, and analysis products, reducing processing from about one hour to five minutes per collection. I developed the processing proof of concept in approximately one week using Python, ArcPy, and AI-assisted coding.</p><p>I trained teammates and refined the code from their feedback. The team continued using the pipeline to process and analyze data after I left.</p>
        <ul>
          <li>Overlaid measurements on drone imagery for spatial review.</li>
          <li>Compared LiDAR-derived canopy structure with ground measurements and crop-stress response.</li>
          <li>Compared Smartstick measurements with treatment and crop-stress observations to assess relationships.</li>
        </ul>

          <figcaption>Illustrative workflow: GPS-tagged observations converted to points and assigned to buffered experimental plots.</figcaption>

          <figcaption>Illustrative plot-level summaries used to compare spatial patterns across an experiment.</figcaption>

        <p>These explanatory illustrations do not contain Corteva data or depict a Corteva field.</p>

        <h2>Field-data comparison and research analysis</h2>
        <p>I compared field measurements with drone imagery, LiDAR-derived canopy structure, and treatment data to review spatial patterns and support interpretation of experimental results.</p>

        <h2>Automated N₂O chamber system</h2>
        <p>I co-designed and co-built a sixteen-chamber automated soil-gas system — wiring, tubing, controls, and code. It sampled every fifteen minutes for four months, so failures in a chamber, valve, line, or control component could compromise long stretches of data.</p>
        <p>I operated and monitored the system daily, maintained it, and troubleshot equipment issues. Working with my research team and data scientists, I assessed measurement quality, analyzed nitrous oxide data, and interpreted the research findings.</p>
        <figure>
          <img src="/gas_sampling_build.jpeg" alt="Multi-channel soil-gas sampling and valve-control system under construction" loading="lazy" />
          <figcaption>In-house valve-control and sampling system carrying chamber air to an on-site analyzer.</figcaption>
        </figure>

        <h2>Gold Standard instrument-comparison site</h2>
        <p>I co-designed and built the &quot;Gold Standard&quot; weather station to compare weather instruments and measure how much similar systems differ. It included nine rain gauges, four anemometers, four temperature sensors, infrared sensors, and instruments from vendors such as Davis.</p>
        <p>A data logger transmitted observations by radio to a computer in the research building. I supported ingestion, maintained the field system, and helped make the measurements available through a web-based visualization site.</p>
        <figure>
          <img src="/gold_standard_field.jpeg" alt="Gold Standard weather station at Corteva field demonstration plots" loading="lazy" />
          <figcaption>Reference site supporting side-by-side comparisons of precipitation, wind, temperature, and infrared measurements.</figcaption>
        </figure>
        <figure>
          <img src="/gold_standard.jpeg" alt="Dylan McDermott on site during assembly of the reference weather station" loading="lazy" />
          <figcaption>On site during assembly of the sensor mast, logging enclosures, and radio-linked acquisition system.</figcaption>
        </figure>

        <h2>Infrared-radiometer fleet tracking</h2>
        <p>I built, maintained, shipped, and supported a fleet of more than 200 infrared radiometers across the Midwest, California, Texas, and South America.</p>
        <p>I created dashboards tracking serial numbers, calibration, locations, shipments, repairs, and data status. They showed which instruments were available, deployed, in transit, or needed maintenance.</p>
        <figure>
          <img src="/infrared-applications.jpg" alt="Infrared radiometer used for crop-canopy temperature measurements" loading="lazy" />
          <figcaption>Infrared radiometers built and maintained for distributed crop-canopy research.</figcaption>
        </figure>
        <figure>
          <img src="/field_plot_2.png" alt="Illustrative field map with green and red instrument-status markers" loading="lazy" />
          <figcaption>Illustrative fleet view showing operational placements and units requiring follow-up; no Corteva data is shown.</figcaption>
        </figure>

        <h2>Results and impact</h2>
        <ul>
          <li>Built the Smartstick processing proof of concept in approximately one week and reduced processing from about one hour to five minutes per collection.</li>
          <li>Converted thousands of timestamped, GPS-tagged readings into validated plot-level datasets and maps.</li>
          <li>Applied one reproducible workflow across seven research sites and compared selected results with drone imagery and LiDAR.</li>
          <li>Co-designed and built automated soil-gas and reference weather-station systems, then maintained and debugged them during field deployment.</li>
          <li>Created centralized tracking for more than 200 distributed infrared radiometers.</li>
        </ul>
