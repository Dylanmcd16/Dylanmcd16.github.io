        <p>PLRB - Weather &amp; Catastrophe Analyst</p>
        <h1>Weather, Catastrophe, &amp; Geospatial Analysis</h1>
        <p>I build and maintain production weather-data systems that turn NOAA, IEM, and other environmental datasets into reliable maps, reports, archives, and claims-facing applications.</p>
        <ul>
          <li>Meteorological analysis</li>
          <li>Python automation</li>
          <li>ArcPy</li>
          <li>ArcGIS Enterprise</li>
          <li>Data quality control</li>
          <li>Operational resilience</li>
          <li>REST APIs</li>
        </ul>

        <h2>The challenge: Turning fragmented weather data into reliable claims decision support</h2>
        <p>Claims professionals need weather evidence they can trust on the day they ask for it. I turn NOAA, IEM, and other environmental data into daily production systems that remain accurate when reports arrive late, records are duplicated or incomplete, and downloads fail silently — and that keep maps, tables, and exports synchronized end to end.</p>

        <h2>Daily weather-data production</h2>
        <p>I built and continue to maintain and improve daily workflows for storm-report processing, data acquisition, SPC outlook imagery, ArcGIS-ready datasets, email text, and date-stamped operational archives. The workflows are built to handle large daily report volumes; occurrence-number assignment is the primary remaining manual step, alongside a short surface-analysis review.</p>
        <p>Python and ArcPy retrieve NOAA and Iowa Environmental Mesonet products, validate and reconcile storm reports, standardize schemas and hazard classifications, enrich records through spatial joins, generate operational maps, and produce synchronized shapefile, DBF, CSV, and text exports. The workflow also identifies failed or missing inputs before dependent products are created, substantially reducing repetitive daily processing. Companion workflows handle ArcGIS Server publishing and team notification.</p>
        <ul>
          <li>Reconciles reports that arrive after the initial daily run and removes delayed reports already included in the previous published dataset.</li>
          <li>Validates occurrence numbers and timestamps, removes duplicate records, and repairs missing city or ZIP attributes through spatial joins and nearest-feature analysis.</li>
          <li>Checks required downloads and source files before dependent imagery and data products are generated.</li>
          <li>Propagates analyst edits through merged feature classes, dissolves, maps, tables, and final exports.</li>
        </ul>

        <h2>Claims-facing weather applications</h2>
        <p>I build and maintain ArcGIS Experience Builder applications for hail, wind, hurricanes, and current weather. They combine reports, warnings, observations, radar-derived products, precipitation, lightning, and other evidence so claims professionals can investigate a location without handling raw scientific formats.</p>
        <p>Where standard widgets were insufficient, I developed custom behavior and API integrations for date filtering, layer control, record generation, map synchronization, and location-specific reports.</p>
        <figure>
          <img src="/hail_research_map.png" alt="Hail Research ArcGIS Experience Builder application" loading="lazy" />

        </figure>
        <figure>

          <figcaption>Hurricane event analysis - Multi-source application combining tropical guidance, radar, warnings, outlooks, precipitation, and observations.</figcaption>
        </figure>

        <h2>Scientific validation of weather products</h2>
        <p>I evaluate whether new datasets are scientifically defensible and operationally useful by testing what each variable represents, its spatial and temporal resolution, known biases, update behavior, and the evidence required for responsible interpretation.</p>
        <p>Examples include comparing surface PM2.5 observations with HRRR-Smoke guidance and evaluating products such as ProbSevere and radar-derived hail estimates. The emphasis is not simply adding more layers; it is preventing modeled or remotely sensed estimates from being presented as direct observations.</p>
        <figure>
          <img src="/smoke_map_example.jpeg" alt="ArcGIS Pro proof of concept comparing PM2.5 observations with HRRR-Smoke output" loading="lazy" />
          <figcaption>Proof of concept used to test the practical limits of comparing modeled smoke with surface air-quality observations.</figcaption>
        </figure>

        <h2>Exploratory convective-wind modeling</h2>
        <p>I conducted an exploratory machine-learning study that matched observed convective gusts with physically relevant environmental predictors, compared estimated and recorded wind speeds, and diagnosed failures caused by sparse station coverage and storm-scale variability.</p>
        <p>The work clarified where modeled gust estimates may add context and where direct observations and expert meteorological analysis remain necessary.</p>

        <h2>Automated Tropical Cyclone Track Mapping</h2>
        <p>I built a Python and ArcPy workflow that converts National Hurricane Center GIS archives into publication-ready tropical-cyclone track maps. The workflow filters data by storm, reads track chronology and metadata, calculates the display extent, updates ArcGIS Pro layouts, validates required inputs, and exports standardized portrait and landscape products at 300 DPI.</p>
        <p>This replaced a repetitive manual process with a reusable, error-checked mapping pipeline.</p>
        <figure>
          <img src="/2026_bertha_track.jpg" alt="Automated tropical cyclone track map generated from National Hurricane Center GIS archive data" loading="lazy" />
          <figcaption>Track map produced automatically from NHC GIS data, with layout extent, storm metadata, and export handled programmatically.</figcaption>
        </figure>

        <h2>Esri Special Achievement in GIS (SAG) Award</h2>
        <p>PLRB received Esri&rsquo;s 2025 Special Achievement in GIS (SAG) Award, which recognizes organizations for innovative use of GIS technology. Esri presents the award to a small share of its user community each year, selected from hundreds of thousands of organizations worldwide.</p>
        <p>The recognized work is the body of catastrophe analytics and claims-facing GIS delivery described on this page: the automated storm-report and weather-data pipelines, the ArcGIS Experience Builder applications used by member claims professionals, and the ArcGIS Server services and map products that keep those applications supplied with validated data. I built and maintain the production automation and applications behind that work as part of PLRB&rsquo;s Weather &amp; Catastrophe team.</p>
