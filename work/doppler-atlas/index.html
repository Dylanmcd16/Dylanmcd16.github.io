      <h1>VR/3D Radar Viewer</h1>
      <p>Doppler Atlas is my independent weather visualization project for exploring radar in 3D and virtual reality, built with Unity and OpenXR.</p>
      <p>A different perspective on the storm. This independent project brings together my meteorology background and software development through weather data, 3D rendering, and spatial interaction.</p>
      <figure><img src="/doppler-atlas/orbit.webp" width="1280" height="598" alt="A 3D radar reflectivity volume above a map" /><figcaption>Radar in three dimensions. Actual app capture.</figcaption></figure>
      <h2>One storm. Room to explore.</h2>
      <p>Move around the radar volume, examine vertical sections, and arrange weather displays in movable panels.</p>
